name: R CMD check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("FNN", "MASS", "Rcpp", "RcppArmadillo", "testthat", "twinning", "ggplot2", "patchwork", "jsonlite"))'
      - name: Build package
        run: R CMD build software/prime
      - name: Check package
        run: |
          package_version=$(Rscript --vanilla -e 'cat(read.dcf("software/prime/DESCRIPTION")[1,"Version"])')
          R CMD check --no-manual "prime_${package_version}.tar.gz"
      - name: Verify portable workflow contracts
        run: make verify-workflow
      - name: Fresh install from pinned source and smoke
        run: make bootstrap
      - name: Validate historical data and current numerical overlay
        run: make validate-release
      - name: Rebuild current four-panel figures from saved results
        run: make artifacts-current-20261011
