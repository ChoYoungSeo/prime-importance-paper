name: Python package checks

"on":
  push:
    paths:
      - "packages/python/**"
      - ".github/workflows/Python-package-check.yml"
  pull_request:
    paths:
      - "packages/python/**"
      - ".github/workflows/Python-package-check.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: packages/python

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint
        run: python -m ruff check src tests examples benchmarks

  test:
    name: ${{ matrix.config.os }} (Python ${{ matrix.config.python }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.config.python }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[test,plot]'
      - name: Test
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Validate installed wheel
        run: |
          python -m pip install dist/*.whl pytest matplotlib
          python -m pip check
          python -m pytest
          MPLBACKEND=Agg python examples/quickstart.py
      - name: Save checked build distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: prime-python-checked-build-${{ github.sha }}
          path: packages/python/dist/
          if-no-files-found: error
          retention-days: 14
