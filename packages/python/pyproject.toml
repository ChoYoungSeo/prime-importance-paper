[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-importance"
version = "0.2.2"
description = "Response-relevant selection and proportional global variable importance"
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Youngseo Cho"},
  {name = "V. Roshan Joseph"}
]
keywords = [
  "variable importance",
  "sensitivity analysis",
  "feature selection",
  "dependent inputs",
  "explainable AI"
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10"
]

[project.optional-dependencies]
test = ["pytest>=8"]
plot = ["matplotlib>=3.7"]
dev = ["build>=1", "matplotlib>=3.7", "pytest>=8", "ruff>=0.6", "twine>=6"]

[project.urls]
Homepage = "https://github.com/ChoYoungSeo/prime-importance-paper"
Repository = "https://github.com/ChoYoungSeo/prime-importance-paper"
Paper = "https://arxiv.org/abs/2610.17053"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
